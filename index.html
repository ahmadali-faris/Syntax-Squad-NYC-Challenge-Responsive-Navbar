<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>
  <!-- Font awesome link -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

   <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS via CDN -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-slate-50 min-h-[200vh]">
  <!-- Header starts here -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200         max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <div class="flex items-center ">
      <div class="md:hidden cursor-pointer">
        <i class="fa-solid fa-bars hover:text-blue-500"></i>
      </div>
      <img src="./creative-and-elegant-minimalistic-logo-design-for-technology-and-software-company-vector-removebg-preview.png" alt="Logo" width="40" class="md:w-15">
      <h2 class="text-xl md:text-2xl font-bold">Vesper</h2>
    </div>
    <ul class="nav-links hidden lg:flex items-center justify-center gap-6 text-sm">
      <li><a href="#" class="nav-link hover:text-blue-500 hover:border-b-2 border-blue-500 pb-1 font-medium text-sm transition">Home</a></li>
      <li><a href="#" class="nav-link hover:text-blue-500 hover:border-b-2 border-blue-500 pb-1 font-medium text-sm transition">Shop</a></li>
      <li><a href="#" class="nav-link hover:text-blue-500 hover:border-b-2 border-blue-500 pb-1 font-medium text-sm transition">Categories</a></li>
      <li><a href="#" class="nav-link hover:text-blue-500 hover:border-b-2 border-blue-500 pb-1 font-medium text-sm transition">Contact</a></li>
    </ul>

    <div class="flex items-center gap-6 cursor-pointer">
      <div class="hidden lg:block border border-blue-500 bg-slate-200 rounded-xl p-1">
      <i class="fa-solid fa-magnifying-glass text-sm mr-2"></i>
      <input type="search" name="Product_Search" id="product" placeholder="Search products..." class="text-sm">
      </div>
      <div class="md:hidden">
        <i class="fa-solid fa-magnifying-glass hover:text-blue-500"></i>
      </div>
      <i class="fa-regular fa-heart hover:text-blue-500"></i>
      <i class="fa-solid fa-cart-shopping hover:text-blue-500"></i>
      <button class="hidden md:inline-flex px-4 py-2 bg-blue-500 rounded-4xl text-white cursor-pointer font-medium text-sm hover:bg-blue-600 transition"><i class="fa-regular fa-user mr-1 text-sm"></i><span class="ml-1">Login</span></button>

    </div>
  </header>
  <!-- Header ends here -->
   
</body>
</html>
